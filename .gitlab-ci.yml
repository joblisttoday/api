# These folders are cached between builds
# https://docs.gitlab.com/ce/ci/yaml/README.html#cache
cache:
  paths:
    - node_modules/

deploy_api:
  image: node:latest
  variables:
    NODE_ENV: "production"
    VERBOSE: "true"
  script:
    - npm install
    - npx wrangler publish ./src/index.ts
  rules:
    # - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: $CI_COMMIT_REF_NAME == "main"

test_api:
  image: node:latest
  variables:
    NODE_ENV: "production"
    VERBOSE: "true"
  script:
    - npm install
    - npx wrangler test ./src/index.ts
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
