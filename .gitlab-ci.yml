# These folders are cached between builds
# https://docs.gitlab.com/ce/ci/yaml/README.html#cache
cache:
  paths:
    - node_modules/

deploy_api:
  image: node:latest
  variables:
    NODE_ENV: "production"
    VERBOSE: "true"
  script:
    - npm install
    - npx wrangler publish src/index.js
    - ls -la
    - tar -czf /tmp/artifact.tar.gz .
    - mkdir public
    - mv /tmp/artifact.tar.gz public
    - ls -la public
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

test_api:
  image: node:latest
  variables:
    NODE_ENV: "production"
    VERBOSE: "true"
  script:
    - npm install
    - npm run test
  rules:
    - if: $CI_COMMIT_REF_NAME == "feat/test"
